name: Restart Analytics

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ZONE: ${{ secrets.GCP_ZONE || 'us-central1-a' }}
  VM_NAME: ${{ secrets.GCP_VM_NAME || 'predictor-vm' }}

jobs:
  restart-analytics:
    name: Restart Analytics on VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Check service and refresh status
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --command="$(cat <<'REMOTE_SCRIPT'
          echo "=== predictor.service ==="
          sudo systemctl is-active predictor
          echo "=== predictor-refresh.service ==="
          sudo systemctl is-active predictor-refresh || true
          sudo journalctl -u predictor-refresh -n 10 --no-pager || true
          REMOTE_SCRIPT
          )"

      - name: Stop predictor, take baseline, restart
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --command="$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          echo "=== Stopping predictor and refresh ==="
          sudo systemctl stop predictor || true
          sudo systemctl stop predictor-refresh || true
          sleep 2

          echo "=== Taking phase0 baseline ==="
          cd /data/predictor/prediction-market
          sudo -u predictor /data/predictor/venv/bin/python - <<'PYEOF'
          import asyncio, sys
          sys.path.insert(0, '/data/predictor/prediction-market')
          from dotenv import load_dotenv
          load_dotenv('/data/predictor/.env')
          import aiosqlite
          from core.config import get_config
          from core.snapshots.phase0 import take_phase0_baseline_snapshot

          async def run():
              cfg = get_config()
              async with aiosqlite.connect(cfg.database.db_path) as db:
                  await take_phase0_baseline_snapshot(db)
                  print('Phase0 baseline snapshot taken.')

          asyncio.run(run())
          PYEOF

          echo "=== Restarting predictor ==="
          sudo systemctl start predictor
          sleep 10
          sudo systemctl is-active predictor
          REMOTE_SCRIPT
          )"

      - name: Trigger market refresh (non-blocking)
        run: |
          # Runs AFTER the baseline step: previously the refresh was dispatched
          # first and the next step's `systemctl stop predictor-refresh` killed
          # it seconds later, so this workflow never actually refreshed.
          # Fire and return — the matching phase takes 30-90 min. The running
          # predictor picks up new pairs via its pair-refresh loop.
          gcloud compute ssh "$VM_NAME" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --command="sudo systemctl start --no-block predictor-refresh.service && echo 'Refresh dispatched (running in background on VM)'"

      - name: Tail recent logs
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --command="sudo journalctl -u predictor -n 40 --no-pager"
