[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
explicit_package_bases = true

# Phased typing rollout.
#
# Each module listed below has outstanding mypy errors that we are working
# through phase by phase (see PR history: phases 1–10 of the typing
# initiative). As each phase cleans a module, remove it from this list and
# the blocking mypy check in CI will start enforcing types on it.
#
# Goal state: this overrides block is empty, and the root [tool.mypy]
# section above is the only config.

[tool.ruff.lint]
# Ruff's classic default rule set, pinned so a ruff release that widens its
# defaults (0.17 added blind-except and others) doesn't change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests put the project root on sys.path before importing it.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
